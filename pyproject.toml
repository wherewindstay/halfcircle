[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "halfcircle"
version = "0.3.0"
description = "Halfcircle diagrams for inspecting bidirectional flow data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sohyun Park" }]
maintainers = [{ name = "Sohyun Park" }]
keywords = ["flow data", "visualization", "migration", "trade", "spatial interaction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.20", "pandas>=1.3", "matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/wherewindstay/halfcircle"
"Original R package" = "https://cran.r-project.org/src/contrib/Archive/halfcircle/"

[tool.hatch.build.targets.wheel]
packages = ["src/halfcircle"]
